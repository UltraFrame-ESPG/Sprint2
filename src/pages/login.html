<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS EXTERNO -->
     <link rel="stylesheet" href="./src/css/estilo.css">

    <title>UltraFrame</title>
</head>
<body>
    <div class="container">
        <!-- LOGO -->
         <h1 class="logo">
            UltraFrame
         </h1>

         <!-- CAIXA DE LOGIN -->
          <div class="login-box">
            <h2>Login</h2>

             <!-- EMAIL -->
            <label>E-mail</label>

            <input 
                type="email"
                placeholder="Insira o seu email"
            >

            <!-- SENHA -->
             <label>Senha</label>

            <input 
                type="password"
                placeholder="Insira a sua senha"
            >

            <!-- BOTÃO -->
             <button>
                Entrar
             </button>

          </div>

    </div>

    <!-- JS EXTERNO -->
     <script src="./src/js/script.js"></script>
     
</body>
</html>
