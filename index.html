<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rambla:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <!-- CSS EXTERNO -->
     <link rel="stylesheet" href="./src/css/estilo.css">

    <title>UltraFrame - Login</title>
</head>
<body>
    <div class="container">
        <!-- LOGO -->
         <h1 class="logo">
            <span class="ultra">Ultra</span>Frame 
         </h1>

         <!-- CAIXA DE LOGIN -->
          <div class="login-box">
            <h2>Login</h2>

             <!-- EMAIL -->
            <label>Email</label>

            <input 
                type="email"
                placeholder="Insira o seu email"
                id="email"
            >

            <!-- SENHA -->
             <label>Senha</label>

            <input 
                type="password"
                placeholder="Insira a sua senha"
                id="senha"
            >
            <!--Esqueci a senha -->
            <a href="#" id="esqueci-senha" class="btn-esqueci-senha">Esqueci minha senha</a>

            <!-- BOTÃO -->
             <div id="mensagem"></div>
                <button type="button" onclick="logar(); return false">
                    Entrar
                </button>

          </div>

    </div>

    <!-- JS EXTERNO -->
     <script src="./src/js/script.js"></script>
     
</body>
</html>
